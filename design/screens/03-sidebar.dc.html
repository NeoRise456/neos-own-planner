<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&amp;family=Figtree:wght@400;500;600;700;800&amp;family=Pixelify+Sans:wght@400..700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<nav aria-label="Main" style="width: 220px; min-height: 820px; height: 100%; box-sizing: border-box; padding: 18px 12px 16px; background: #000000; border-right: 1px solid #1A1A1A; color: #F5F5F5; font-family: {{uiFont}}; font-size: 13px; display: flex; flex-direction: column; gap: 2px">

  <div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px 22px">
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, 4px); gap: 1px">
      <sc-for list="{{logo}}" as="p" hint-placeholder-count="35"><span style="width: 4px; height: 4px; background: {{p.c}}"></span></sc-for>
    </div>
    <span style="font-size: 14px; font-weight: 600; color: #FFFFFF">planner</span>
  </div>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
    <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.st}}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{it.icon}}" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"></path></svg>
      <span style="flex: 1">{{it.label}}</span>
      <span style="font-size: 11px; color: {{it.badgeCol}}">{{it.badge}}</span>
    </a>
    <sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 1px; padding: 6px 0 12px 14px; margin-left: 15px; border-left: 1px solid #1F1F1F">
        <sc-for list="{{sub}}" as="s" hint-placeholder-count="4">
          <sc-if value="{{s.heading}}" hint-placeholder-val="{{false}}">
            <span style="padding: 12px 8px 4px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #6B6B6B">{{s.label}}</span>
          </sc-if>
          <sc-if value="{{s.item}}" hint-placeholder-val="{{true}}">
            <button aria-current="{{s.cur}}" onClick="{{s.pick}}" style="{{s.st}}">
              <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; background: {{s.tone}}"></span>
              <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.label}}</span>
            </button>
          </sc-if>
          <sc-if value="{{s.isNew}}" hint-placeholder-val="{{false}}">
            <button onClick="{{s.pick}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; min-height: 32px; margin-top: 6px; padding: 0 8px; border-radius: 6px; font-family: inherit; font-size: 12px; color: #BDBDBD">
              <svg width="9" height="9" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6"></path></svg>{{s.label}}
            </button>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
  </sc-for>

  <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #1A1A1A; display: flex; flex-direction: column; gap: 4px">
    <a href="#settings" style="height: 36px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; color: #9A9A9A; text-decoration: none; font-size: 13px">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.01 6.26 L14.84 6.50 L14.84 9.50 L13.01 9.74 L12.77 10.31 L13.90 11.77 L11.77 13.90 L10.31 12.77 L9.74 13.01 L9.50 14.84 L6.50 14.84 L6.26 13.01 L5.69 12.77 L4.23 13.90 L2.10 11.77 L3.23 10.31 L2.99 9.74 L1.16 9.50 L1.16 6.50 L2.99 6.26 L3.23 5.69 L2.10 4.23 L4.23 2.10 L5.69 3.23 L6.26 2.99 L6.50 1.16 L9.50 1.16 L9.74 2.99 L10.31 3.23 L11.77 2.10 L13.90 4.23 L12.77 5.69Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"></path><circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.2" fill="none"></circle></svg>Settings
    </a>
    <span style="padding: 0 10px; font-size: 10px; color: #6B6B6B; text-transform: uppercase">UTC−05:00 · 10:20</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["todo","calendar","routines","protocols"],"default":"todo"},"sub":{"editor":null,"tsType":"Array<object>"},"uiFont":{"editor":"enum","options":["Pixelify Sans","Geist Mono","Space Mono"],"default":"Pixelify Sans","section":"Type"},"$preview":{"width":220,"height":820}}'>
var FONTS = { 'Pixelify Sans': "'Pixelify Sans', ui-monospace, monospace", 'Geist Mono': "'Geist Mono', ui-monospace, monospace", 'Space Mono': "'Space Mono', ui-monospace, monospace" };
var P = ['11110','10001','10001','11110','10000','10000','10000'];
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active || 'todo';
    var logo = [];
    P.forEach(function (row) { row.split('').forEach(function (b) { logo.push({ c: b === '1' ? '#F5F5F5' : 'transparent' }); }); });
    var base = 'height:36px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:10px;text-decoration:none;font-size:13px;';
    var items = [
      { key: 'todo', label: 'Todo', href: 'Todo.dc.html', badge: '8', icon: 'M3 3.5h10v9H3zM5.6 8l1.6 1.6 3.2-3.4' },
      { key: 'calendar', label: 'Calendar', href: 'Calendar.dc.html', badge: '', icon: 'M2.5 3.5h11v10h-11zM2.5 6.5h11M5.5 2v3M10.5 2v3' },
      { key: 'routines', label: 'Routines', href: 'Routines.dc.html', badge: '3', icon: 'M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5' },
      { key: 'protocols', label: 'Protocols', href: 'Protocols.dc.html', badge: '2', icon: 'M5.5 4.5h8M5.5 8h8M5.5 11.5h8M2.5 4.5h.5M2.5 8h.5M2.5 11.5h.5' }
    ].map(function (it) {
      var on = it.key === active;
      return Object.assign({}, it, {
        current: on ? 'page' : 'false',
        open: on && (it.key === 'routines' || it.key === 'protocols'),
        badgeCol: on ? '#555555' : '#6B6B6B',
        st: base + (on ? 'background:#FFFFFF;color:#000000;font-weight:600' : 'color:#9A9A9A')
      });
    });
    var sbase = 'all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:9px;min-height:32px;padding:0 8px;border-radius:6px;font-family:inherit;font-size:12px;width:100%;';
    var sub = (this.props.sub || []).map(function (s) {
      var kind = s.heading ? 'heading' : s.isNew ? 'new' : 'item';
      return {
        label: s.label, pick: s.pick || function () {}, tone: s.tone || '#3A3A3A',
        heading: kind === 'heading', isNew: kind === 'new', item: kind === 'item',
        cur: s.current ? 'true' : 'false',
        st: sbase + (s.current ? 'background:#1A1A1A;color:#FFFFFF;font-weight:600' : 'color:' + (s.dim ? '#6B6B6B' : '#BDBDBD'))
      };
    });
    return { uiFont: FONTS[this.props.uiFont] || FONTS['Pixelify Sans'], logo: logo, items: items, sub: sub };
  }
}
</script>
</body>
</html>
