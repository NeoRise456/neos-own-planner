<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Routines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&amp;family=Figtree:wght@400;500;600;700;800&amp;family=Pixelify+Sans:wght@400..700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#F5F5F5}a:hover{color:#FFFFFF}
button{font-family:inherit}
.r{font-family:'Figtree',system-ui,sans-serif}
.dm{font-family:'Doto',monospace;font-variation-settings:'ROND' 0;font-weight:900}
.lab{font-size:11px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;color:#9A9A9A}
.btn{all:unset;box-sizing:border-box;height:36px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.ent:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.bp{background:#FFFFFF;color:#000000;font-weight:500}.bp:hover{background:#DCDCDC}
.bq{background:#1A1A1A;color:#F5F5F5}.bq:hover{background:#262626}
.bd{background:#3A1111;color:#FF4D4D}.bd:hover{background:#4A1515}
.chip{height:22px;padding:0 8px;border-radius:4px;background:#1A1A1A;font-size:11px;display:inline-flex;align-items:center;color:#BDBDBD;text-transform:uppercase}
.ent{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 12px;margin:0 -12px;border-radius:10px;border-bottom:1px solid #141414}
.ent:hover{background:#0F0F0F}
</style>
</helmet>
<div style="width: 100%; min-height: 860px; box-sizing: border-box; background: #000000; color: #F5F5F5; font-family: {{uiFont}}; font-size: 13px; display: flex; flex-wrap: wrap; align-items: stretch">

  <div style="flex: 1 1 220px; max-width: 220px">
    <dc-import name="Sidebar" active="routines" sub="{{sub}}" ui-font="{{uiFontName}}" hint-size="220px,820px"></dc-import>
  </div>

  <div style="flex: 999 1 560px; min-width: 0">
  <main style="box-sizing: border-box; padding: 44px 48px 80px">
    <div style="max-width: 680px; display: flex; flex-direction: column">

      <div style="display: flex; gap: 20px; align-items: center">
        <div aria-hidden="true" style="width: 76px; height: 76px; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; {{r.tileSt}}"><span class="dm" style="font-size: 36px; color: {{r.tileGlyph}}">{{r.g}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <h1 class="r" style="margin: 0; font-size: 34px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF">{{r.name}}</h1>
          <span class="r" style="font-size: 17px; color: #BDBDBD">{{r.purpose}}</span>
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px">
        <span class="chip">{{r.period}}</span>
        <span class="chip" style="{{r.statusSt}}">{{r.status}}</span>
      </div>

      <section style="margin-top: 32px; border: 1px solid #1A1A1A; border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap">
          <span class="r" style="font-size: 56px; line-height: 52px; font-weight: 800; letter-spacing: -0.03em; color: #FFFFFF">{{r.pct}}%</span>
          <span style="font-size: 12px; color: #9A9A9A">{{r.pctLabel}}</span>
        </div>
        <div role="progressbar" aria-label="Consistency" aria-valuenow="{{r.pct}}" style="height: 6px; border-radius: 3px; background: #1F1F1F; overflow: hidden"><div style="width: {{r.pct}}%; height: 100%; border-radius: 3px; background: {{r.bar}}"></div></div>
        <span style="font-size: 11px; color: #6B6B6B">Done ÷ (done + missed). Cancelled doesn't count.</span>
      </section>

      <section style="margin-top: 34px; display: flex; flex-direction: column">
        <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; border-bottom: 1px solid #1A1A1A">
          <span class="lab">Entries</span>
          <span style="font-size: 11px; color: #6B6B6B">{{r.entryCount}}</span>
        </div>
        <sc-for list="{{r.entries}}" as="e" hint-placeholder-count="2">
          <button class="ent" aria-label="{{e.aria}}">
            <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 8px; border: 1px solid #2A2A2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span class="dm" style="font-size: 17px; color: {{e.tone}}">{{e.g}}</span></span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span class="r" style="font-size: 16px; font-weight: 700; color: #FFFFFF">{{e.title}}</span>
              <span style="font-size: 11px; color: #9A9A9A">{{e.rule}}</span>
            </span>
            <span aria-hidden="true" style="display: flex; gap: 3px; flex-wrap: wrap; max-width: 150px; justify-content: flex-end">
              <sc-for list="{{e.cells}}" as="c" hint-placeholder-count="8"><span style="width: 9px; height: 9px; border-radius: 2px; box-sizing: border-box; {{c.st}}"></span></sc-for>
            </span>
            <span style="min-width: 44px; text-align: right; font-size: 13px; font-weight: 600; color: #FFFFFF; font-variant-numeric: tabular-nums">{{e.score}}</span>
          </button>
        </sc-for>
        <button class="btn bq" style="height: 30px; font-size: 12px; margin-top: 12px; align-self: flex-start"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5"></path></svg>Add entry</button>
      </section>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 40px; padding-top: 20px; border-top: 1px solid #1A1A1A">
        <sc-if value="{{r.ended}}" hint-placeholder-val="{{false}}">
          <button class="btn bp"><svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="4.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"></rect><path d="M9.5 2.5h-6a1 1 0 0 0-1 1v6" stroke="currentColor" stroke-width="1.3" fill="none"></path></svg>Duplicate to restart</button>
        </sc-if>
        <button class="btn bq">Edit</button>
        <button class="btn bq">Change end date</button>
        <sc-if value="{{r.active}}" hint-placeholder-val="{{true}}">
          <button class="btn bq">Duplicate</button>
        </sc-if>
        <button class="btn bd" style="margin-left: auto"><svg width="12" height="13" viewBox="0 0 12 13" aria-hidden="true"><path d="M1.5 3h9M4.5 3V1.5h3V3M2.5 3l.6 8.5h5.8L9.5 3M5 5.5v4M7 5.5v4" stroke="currentColor" stroke-width="1.3" fill="none"></path></svg>Delete</button>
      </div>
    </div>
  </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"uiFont":{"editor":"enum","options":["Pixelify Sans","Geist Mono","Space Mono"],"default":"Pixelify Sans","section":"Type"},"$preview":{"width":1280,"height":860}}'>
var FONTS = { 'Pixelify Sans': "'Pixelify Sans', ui-monospace, monospace", 'Geist Mono': "'Geist Mono', ui-monospace, monospace", 'Space Mono': "'Space Mono', ui-monospace, monospace" };
var R = {
  exercise: { name: 'Exercise plan', g: 'Ex', tone: '#A8CC8C', purpose: 'Get stronger and have more energy', period: 'Sep 1 → Nov 30', status: 'Active · 21 days left', pct: 91, pctLabel: '10 of 11 done in November', entries: [
    { title: 'Morning exercise', g: 'Mo', rule: 'Daily · 08:00 · due 09:00', seq: 'dddddmdd', score: '7/8' },
    { title: 'Gym', g: 'Gy', rule: 'Mon, Wed, Fri · 18:00 · 1h · Gym warm-up', seq: 'ddd', score: '3/3' }] },
  morning: { name: 'Morning routine', g: 'Mo', tone: '#E6CF8F', purpose: 'Start the day ready', period: 'Nov 1 → Jan 31', status: 'Active · 83 days left', pct: 85, pctLabel: '41 of 48 done in November', entries: [
    { title: 'Shower', g: 'Sh', rule: 'Daily · 20m · Shower', seq: 'dddddddd', score: '8/8' },
    { title: 'Vitamins', g: 'Vi', rule: 'Daily · by 12:00', seq: 'ddmddddd', score: '7/8' },
    { title: 'Water', g: 'Wa', rule: 'Daily · 4 times', seq: 'ddmdddmd', score: '26/32', tone: '#E59AC2' }] },
  uni: { name: 'Uni — Term 1', g: 'Un', tone: '#8EC8F8', purpose: 'Pass the term', period: 'Sep 8 → Jan 23', status: 'Active · 75 days left', pct: 100, pctLabel: '3 of 3 done in November', entries: [
    { title: 'Calculus (Mon)', g: 'Ca', rule: 'Mon · 09:00 · 2h', seq: 'd', score: '1/1', tone: '#B5B5B5' },
    { title: 'Physics (Tue)', g: 'Ph', rule: 'Tue · 11:00 · 2h', seq: 'd', score: '1/1' },
    { title: 'Calculus (Thu)', g: 'Ca', rule: 'Thu · 16:00 · 2h', seq: 'd', score: '1/1', tone: '#B5B5B5' }] },
  spring: { name: 'Exercise — spring', g: 'Ex', tone: '#A8CC8C', purpose: 'Get back in shape', period: 'Mar 1 → May 31', status: 'Ended', ended: true, pct: 71, pctLabel: '64 of 90 done over the whole period', entries: [
    { title: 'Morning exercise', g: 'Mo', rule: 'Daily · 08:00 · due 09:00', seq: 'ddmdmddmddmdddmd', score: '41/62' },
    { title: 'Gym', g: 'Gy', rule: 'Mon, Wed, Fri · 18:00 · 1h · Gym warm-up', seq: 'dddmddddmddd', score: '23/28' }] }
};
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'exercise' }; }
  renderVals() {
    var self = this, s = this.state, x = R[s.sel];
    var ended = !!x.ended;
    var sub = [
      { label: 'Exercise plan', key: 'exercise', tone: '#A8CC8C' },
      { label: 'Morning routine', key: 'morning', tone: '#E6CF8F' },
      { label: 'Uni — Term 1', key: 'uni', tone: '#8EC8F8' },
      { label: 'Ended', heading: true },
      { label: 'Exercise — spring', key: 'spring', tone: '#3A3A3A', dim: true },
      { label: 'New routine', isNew: true }
    ].map(function (it) {
      return Object.assign({}, it, { current: it.key === s.sel, pick: it.key ? function () { self.setState({ sel: it.key }); } : function () {} });
    });
    var r = Object.assign({}, x, {
      ended: ended, active: !ended,
      tileSt: ended ? 'border:1px solid #2A2A2A' : 'background:' + x.tone,
      tileGlyph: ended ? '#3A3A3A' : '#111111',
      statusSt: ended ? 'color:#9A9A9A' : 'background:#FFFFFF;color:#000000',
      bar: ended ? '#6B6B6B' : '#FFFFFF',
      entryCount: x.entries.length + (x.entries.length === 1 ? ' entry' : ' entries'),
      entries: x.entries.map(function (e) {
        var tone = ended ? '#6B6B6B' : (e.tone || x.tone);
        return Object.assign({}, e, {
          tone: tone,
          aria: e.title + ', ' + e.rule + ', ' + e.score,
          cells: e.seq.split('').map(function (k) { return { st: k === 'd' ? 'background:' + tone : 'background:#2A2A2A' }; })
        });
      })
    });
    return {
      uiFont: FONTS[this.props.uiFont] || FONTS['Pixelify Sans'],
      uiFontName: this.props.uiFont || 'Pixelify Sans',
      sub: sub, r: r
    };
  }
}
</script>
</body>
</html>
